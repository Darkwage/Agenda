name: Build Android APK

# Runs automatically on every push to main, and can also be triggered
# manually from the "Actions" tab on GitHub (useful from a phone browser).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Recreate the permanent signing key from secrets
        run: echo "${{ secrets.AGENDA_KEYSTORE_BASE64 }}" | base64 -d > android/app/agenda-signing.keystore

      - name: Build debug APK
        working-directory: android
        env:
          AGENDA_KEYSTORE_PATH: agenda-signing.keystore
          AGENDA_KEYSTORE_PASSWORD: ${{ secrets.AGENDA_KEYSTORE_PASSWORD }}
          AGENDA_KEY_ALIAS: ${{ secrets.AGENDA_KEY_ALIAS }}
          AGENDA_KEY_PASSWORD: ${{ secrets.AGENDA_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
